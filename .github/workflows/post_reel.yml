name: Quote Reel to Instagram

on:
  # Uncomment to run on a schedule (e.g. daily at 13:30 UTC / 19:00 IST):
  # schedule:
  #   - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      quote:
        description: "Custom quote text (leave blank to auto-fetch from ZenQuotes)"
        required: false
        default: ""
        type: string
      author:
        description: "Author name for custom quote (optional)"
        required: false
        default: ""
        type: string
      palette:
        description: "Color palette (leave blank for auto)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - cobalt_white
          - mustard_ink
          - charcoal_red
          - forest_cream
          - terracotta_cream
          - paper_ink
      dry_run:
        description: "Generate Reel video only without posting to Instagram"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  post-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Ensure ffmpeg is installed
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and post Reel
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          QUOTE_SIGNATURE: "-ff"
          CUSTOM_QUOTE: ${{ github.event.inputs.quote || '' }}
          CUSTOM_AUTHOR: ${{ github.event.inputs.author || '' }}
          CUSTOM_PALETTE: ${{ github.event.inputs.palette || '' }}
          IMAGE_WIDTH: "1080"
          IMAGE_HEIGHT: "1920"
          POST_MODE: "reel"
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python -m src.main

      - name: Upload generated Reel artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-quote-reel
          path: |
            output/*.mp4
            output/*.jpg
          if-no-files-found: ignore

      - name: Commit updated quote history
        if: ${{ (github.event.inputs.dry_run || 'false') != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posted_quotes.json
          git diff --staged --quiet || git commit -m "chore: record posted quote"
          git push
